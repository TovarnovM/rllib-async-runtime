name: Stage 3 CPU experiments

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dqn-hierarchy-gnn

permissions:
  contents: read

jobs:
  experiments:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[stage3-validation]') ||
      contains(github.event.head_commit.message, '[stage3-quality]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - name: Check out candidate and baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked CPU environment
        id: dependencies
        run: uv sync --locked --extra cpu --group dev

      - name: Mixed recurrent Rainbow and PER component measurements
        id: components
        if: ${{ !contains(github.event.head_commit.message, '[stage3-quality]') }}
        run: >-
          timeout 900 uv run --locked --extra cpu --group dev
          python -m benchmarks.team_acceptance components
          --sampling per --dqn-profile rainbow --learning-length 1
          --output artifacts/stage3/components.json

      - name: Five-seed offline memory comparison with extended learning budget
        if: >-
          !cancelled() && steps.dependencies.outcome == 'success' &&
          (steps.components.outcome == 'success' ||
          contains(github.event.head_commit.message, '[stage3-quality]'))
        run: >-
          timeout 1800 uv run --locked --extra cpu --group dev
          python -m benchmarks.team_acceptance quality --require-quality
          --learned-positions 32768
          --output artifacts/stage3/quality-32768.json

      - name: Paired flat SAC regression on this runner
        if: >-
          !cancelled() && steps.dependencies.outcome == 'success' &&
          !contains(github.event.head_commit.message, '[stage3-quality]')
        run: >-
          timeout 1800 uv run --locked --extra cpu --group dev
          python -m benchmarks.compare_flat_revisions
          --output artifacts/stage3/flat-comparison

      - name: Print concise experiment results
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          uv run --locked --extra cpu --group dev python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("artifacts/stage3").glob("*.json"):
              data = json.loads(path.read_text())
              print(json.dumps({
                  "report": str(path),
                  "quality": data.get("quality"),
                  "measurements": [{key: item.get(key) for key in (
                      "seed", "memory", "elapsed_s", "optimizer_updates",
                      "valid_learned_positions", "valid_learned_positions_per_s",
                      "sample_decode_collate_s", "final_publication_s",
                      "retained_payload_estimate_bytes", "before_training",
                      "after_training", "evaluation", "gates",
                  )} for item in data.get("results", [])],
              }, sort_keys=True))
          path = Path("artifacts/stage3/flat-comparison/summary.json")
          if path.exists():
              print(json.dumps({"flat_regression": json.loads(path.read_text())["summary"]}))
          PY

      - name: Save raw measurements and execution logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage3-cpu-evidence-${{ github.sha }}
          path: artifacts/stage3/
          if-no-files-found: warn
          retention-days: 14
